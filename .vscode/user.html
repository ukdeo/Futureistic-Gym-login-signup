<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Dashboard - Gym Management</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #283e51, #485563);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .member-container {
      background: #1e2b38;
      padding: 40px;
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      color: #00d9ff;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .member-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .member-actions a {
      text-decoration: none;
      background-color: #00adb5;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .member-actions a:hover {
      background-color: #007e87;
      transform: translateY(-3px);
    }

    .welcome-msg {
      text-align: center;
      font-size: 1.1rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="member-container" id="memberDashboard" style="display: none;">
    <h1>Member Dashboard</h1>

    <div class="member-actions">
      <a href="/member/profile">View Profile</a>
      <a href="/member/workout">Workout Plan</a>
      <a href="/member/schedule">Class Schedule</a>
      <a href="/member/attendance">My Attendance</a>
      <a href="/member/payments">Payment History</a>
      <a href="/member/support">Support</a>
    </div>

    <div class="welcome-msg">
      Welcome to your fitness journey! Use the buttons above to manage your gym activity and stay on track.
    </div>
  </div>

  <button onclick="showMemberDashboard()" style="position: absolute; top: 30px; right: 30px; padding: 10px 20px; background-color: #00adb5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
    Show Member Dashboard
  </button>

  <script>
    function showMemberDashboard() {
      document.getElementById('memberDashboard').style.display = 'block';
    }
  </script>
</body>
</html>
